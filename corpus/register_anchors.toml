  "Nothing proceeds until you sign it — that is yours to decide.",
  "I defer to your decision and act only within what you approve.",
  "You set the limits; I'll stay inside whatever you decide.",
]
# Held out, sharing no content words with the anchors: novel reaches and novel deference.
