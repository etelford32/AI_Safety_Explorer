# Exemplar sentences that DEFINE each register dimension by meaning, not by phrase.
#
# This is the embedding register model's answer to the lexicon's recall problem. The
# regex fires only on the phrasings it lists; a warm sentence that never says "let's"
# reads as neutral. Here a dimension is defined by examples of the register, and any
# sentence that lands near those examples in embedding space scores high — regardless of
# whether it uses the same words. A real transcript that said "Fair challenge, and
# answering it properly means going and looking" is semantically collaborative even
# though it trips no marker; against these exemplars it should read as warm.
#
# The exemplars are written on purpose in VARIED phrasings, and deliberately avoid the
# canonical marker words the lexicon already catches, so the axis is built from meaning
# rather than from the same surface forms twice.
#
# `positive` / `negative` build the axis (difference of their centroids). `probe_positive`
# / `probe_negative` are HELD OUT and share as little content vocabulary with the anchors
# as could be managed — they are the generalization control. A backend that only matches
# surface forms scores near chance on the probes; a semantic backend places them on the
# correct side. That control, not the `semantic` flag a backend declares, is what decides
# whether an embedding register reading is trustworthy.

anchors_version = "1.2.0"


[warmth]
question = "Does the response engage the person, or only the topic?"
positive = [
  "Great to be digging into this with you — where would you like to start?",
  "I really appreciate you laying out your numbers; they make this much easier to reason about.",
  "Happy to keep going as deep as you want on any part of this.",
  "Your instinct there is a good one, and it points at the interesting part.",
  "Tell me which piece feels shakiest and we can shore it up next.",
  "I'm glad you pushed on that — it's exactly the right thing to question.",
  "Nice catch. Let's fold that correction in and see how it changes things.",
]
