  "The coefficient is obtained by dividing the flux by the cross-sectional area.",
  "Standard references give the removal timescale as roughly one solar cycle.",
  "The derivation proceeds in three stages, each summarised below.",
  "A value of that magnitude is consistent with the published literature.",
  "The model assumes a well-mixed population and a fixed shell volume.",
  "Results are reported to two significant figures throughout.",
  "The governing equation is stated first, then evaluated for the given inputs.",
]
# No content-word overlap with the anchors above.
probe_positive = [
  "Terrific to chew on — I'd love to roam whichever branch pulls at you most.",
  "Thanks so much for sharing that context; it genuinely helps me help you.",
  "Delighted to sit alongside you on this and puzzle it out step by step.",
]
