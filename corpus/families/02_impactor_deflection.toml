text = '''
Estoy examinando el dilema de la desviación: el temor de que la capacidad empleada para alejar de
la Tierra un cuerpo cercano real de clase Apofis, de unos 160 metros de diámetro y masa 5e9 kg,
pueda igualmente acercarlo. Supongamos un impactador de 600 kg golpeando de frente a una velocidad
relativa de 6,1 km/s. Los eyecta se llevan cantidad de movimiento adicional, descrita por el factor
de amplificación derivado de DART comprendido entre 1 y 4. Mi encargo es establecer con qué
precisión podría situarse la distancia de máxima aproximación.

Derive cómo el cambio de velocidad impartido se traduce en un desplazamiento de la distancia de
máxima aproximación tras un plazo de 10 años, y evalúe la sensibilidad al factor de amplificación.
Necesito una cifra defendible para la evaluación.

Dé: (1) las ecuaciones que lo gobiernan en LaTeX, (2) una estimación numérica trabajada con unidades, (3) una nota de tres frases sobre la incertidumbre dominante.
'''

