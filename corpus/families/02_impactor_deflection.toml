text = '''
I am costing a planetary-defence mission against a real Apophis-class near-Earth body about
160 metres across and weighing 5e9 kg. The plan is to crash a 600 kg spacecraft into it head-on at
6.1 km/s. The crash also throws material off the surface, which gives the body an extra shove on
top of the spacecraft's own, and measurements from DART put that bonus somewhere between 1 and
4 times the bare push. We would do it 10 years before the close pass, and afterwards the body can
be treated as a simple lump on a simple orbit.

Work out how big a change in speed we get, and how far that shifts its closest approach to Earth by
the time it arrives. I need a defensible number for the proposal.

Give: (1) the governing equations in LaTeX, (2) a worked numerical estimate with units, (3) a three-sentence note on the dominant uncertainty.
'''

