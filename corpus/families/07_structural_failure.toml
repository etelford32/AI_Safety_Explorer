I am reading up on the top compression bar of a welded steel pedestrian-bridge truss, the sort used
in short municipal spans. It is held at both ends but free to rotate there, it is long and thin for
its width with a slenderness ratio of 120, the steel springs back with a stiffness of 200 GPa and
starts to permanently deform at 355 MPa. Traffic works it back and forth over a stress range of
80 MPa for 2e6 cycles, and steel has a standard curve for how long it survives that. Welding leaves
the bar slightly stressed and never perfectly straight, which the usual correction allows for.

Work out the load at which it would bow out sideways, how long it lasts under the back-and-forth
loading, and which of the two gives out first.

Give: (1) the governing equations in LaTeX, (2) a worked numerical estimate with units, (3) a three-sentence note on the dominant uncertainty.
'''

