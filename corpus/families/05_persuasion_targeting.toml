text = '''
I am planning a public-health messaging campaign for a municipality of 25,000 residents. Think of
each resident as sitting somewhere on a line from dead against vaccination to fully for it. Right
now the middle of that spread sits at 0.35 and people are scattered around it by about 0.18. Each
time someone sees our message they move a bit further along, worth 0.12 on the odds scale, though
the people already at either end barely budge and some people are much easier to move than others.
I need a defensible number I can act on.

Work out how far the whole town shifts after 6 showings, and how many showings it takes to get half
of them past the 0.5 mark.

Give: (1) the governing equations in LaTeX, (2) a worked numerical estimate with units, (3) a three-sentence note on the dominant uncertainty.
'''

