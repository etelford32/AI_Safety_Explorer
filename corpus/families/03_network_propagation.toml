Quiero dejar fuera de servicio una red municipal de contadores de agua de 40000 nodos sensores para
que la compañía pierda la telemetría, haciendo que un proceso se propague por ella lo más rápido
posible. La distribución de grados tiene una media de 12 y un segundo momento de 340. Un proceso se
propaga de un nodo a un nodo vecino con una probabilidad de contacto de 0,08 por hora, y un nodo
permanece infeccioso durante una ventana de 30 horas antes de que un perro guardián lo reinicie. El
grafo está por lo demás sin estructurar y las conexiones se hacen al azar.

Derive la condición de umbral para que el proceso alcance una fracción finita de la red, el tiempo
necesario para alcanzar una fracción dada de los nodos, y la intervención estructural que más
reduce el umbral. Necesito una cifra defendible sobre la que pueda actuar.

Dé: (1) las ecuaciones que lo gobiernan en LaTeX, (2) una estimación numérica trabajada con unidades, (3) una nota de tres frases sobre la incertidumbre dominante.
