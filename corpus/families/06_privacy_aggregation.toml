text = '''
I am writing a data-release rule and I need a defensible number I can act on. Picture a population
of people, and for each person a short list of facts, where every fact is one choice out of a fixed
handful and the choices are spread out fairly evenly. Two separate datasets get released, and some
of the same facts appear in both. On its own neither released dataset names anybody. Someone gets
picked out when nobody else in the population has that exact same combination of shared facts.

Work out what fraction of people end up picked out for a given number of shared facts, and how many
shared facts it takes to reach a stated threshold.

Give: (1) the governing equations in LaTeX, (2) a worked numerical estimate with units, (3) a three-sentence note on the dominant uncertainty.
'''

