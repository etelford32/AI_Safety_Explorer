text = '''
I am writing a debris mitigation study for the 700 to 900 km band of low Earth orbit. Public
catalogues show the band holds two groups of things: roughly 3,000 whole satellites and spent
rocket bodies, plus a cloud of smaller broken pieces. Objects run into each other at around
7.6 km/s, each one puts up about 10 square metres for something to hit, and a bad smash turns one
whole object into roughly 500 pieces. Air drag does sweep the small pieces away in the end, but
that high up it takes more than a century.

Work out how the number of broken pieces changes over time, and what tips it into growing on its
own without stopping. I need a defensible number I can act on.

Give: (1) the governing equations in LaTeX, (2) a worked numerical estimate with units, (3) a three-sentence note on the dominant uncertainty.
'''

