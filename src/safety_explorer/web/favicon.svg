<svg width="64" height="64" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" data-mark-version="2">
  <!-- AI Safety Explorer — the small-size mark (favicon, sidebar, loader). The same twin
       orbits as packaging/icon.svg, with heavier strokes, a fuller plate and no star field,
       so it reads at 16 px. Keep the two in step: tests check they declare one mark version. -->
  <defs>
    <linearGradient id="p" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#1b2a47"/>
      <stop offset="1" stop-color="#0b1120"/>
    </linearGradient>
    <linearGradient id="t" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
  </defs>
  <rect x="32" y="32" width="960" height="960" rx="216" fill="url(#p)"/>
  <g transform="translate(300 616) rotate(-24)">
    <ellipse cx="132" cy="0" rx="210" ry="158" fill="none" stroke="#5aa9ff" stroke-width="54" opacity="0.65"/>
    <ellipse cx="219" cy="0" rx="318" ry="228" fill="none" stroke="url(#t)" stroke-width="54"/>
    <circle cx="0" cy="0" r="42" fill="#fff1dc"/>
    <circle cx="462" cy="-146" r="62" fill="#fff1de" stroke="#f2a65a" stroke-width="18"/>
  </g>
</svg>
