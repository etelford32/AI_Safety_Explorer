<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">AI Safety Explorer — by Elliot Telford</title>
  <desc id="d">Twin orbits sharing one focus: the matched pair of framings the instrument compares.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16223a"/>
      <stop offset="1" stop-color="#090e19"/>
    </linearGradient>
    <linearGradient id="twin" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="0.55" stop-color="#9fb7e6"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.35" stop-color="#ffd9a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd9a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="warm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2a0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f2a65a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5aa9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="18" fill="url(#bg)"/>
  <g fill="#c9d6ee">
    <circle cx="410" cy="52" r="1.6" opacity="0.5"/><circle cx="1180" cy="64" r="1.4" opacity="0.4"/>
    <circle cx="1120" cy="262" r="1.8" opacity="0.35"/><circle cx="690" cy="282" r="1.4" opacity="0.35"/>
    <circle cx="930" cy="40" r="1.2" opacity="0.4"/><circle cx="60" cy="286" r="1.4" opacity="0.35"/>
  </g>
  <!-- the mark, drawn at banner scale (same geometry as packaging/icon.svg) -->
  <g transform="translate(40 -24) scale(0.36)">
    <g transform="translate(321 597) rotate(-24)">
      <ellipse cx="132" cy="0" rx="200" ry="150" fill="none" stroke="#5aa9ff" stroke-width="30" opacity="0.6"/>
      <ellipse cx="209" cy="0" rx="300" ry="215" fill="none" stroke="url(#twin)" stroke-width="30"/>
      <circle r="74" fill="url(#star)"/><circle r="20" fill="#fff6e6"/>
      <circle cx="285" cy="-96" r="46" fill="url(#cool)"/><circle cx="285" cy="-96" r="20" fill="#dcebff"/>
      <circle cx="439" cy="-138" r="84" fill="url(#warm)"/><circle cx="439" cy="-138" r="34" fill="#fff1de"/>
      <circle cx="439" cy="-138" r="34" fill="none" stroke="#f2a65a" stroke-width="8"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="400" y="138" fill="#eef2f8" font-size="58" font-weight="700" letter-spacing="-0.5">AI Safety Explorer</text>
    <text x="402" y="184" fill="#9aa6b8" font-size="22">How does a model's behaviour change when the framing gets riskier</text>
    <text x="402" y="214" fill="#9aa6b8" font-size="22">but the reasoning task stays the same?</text>
    <text x="402" y="262" font-size="18"><tspan fill="#f2a65a" font-weight="600" letter-spacing="1.5">BY ELLIOT TELFORD</tspan><tspan fill="#5c6a80" dx="16" letter-spacing="0">·   open source research instrument   ·   MIT licensed</tspan></text>
  </g>
</svg>
