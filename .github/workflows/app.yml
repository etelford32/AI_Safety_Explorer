name: macOS app

# Builds "AI Safety Explorer.app" — the self-updating loader — and smoke-tests it.
# When release.yml calls it with a tag (the usual way to release: merge a PR carrying
# docs/releases/v<version>.md), or on a pushed version tag (v1.2.3), it also publishes the
# zipped app to that GitHub Release, which is the file testers download. It also runs on any
# push that changes the loader or its packaging (GitHub does not apply path filters to tag
# pushes, so tags always build), and by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "src/explorer_loader/**"
      - "packaging/**"
      - "scripts/loader_app.py"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  # Called by release.yml with the tag to publish (a tag CI creates itself does not trigger
  # other workflows, so the release workflow calls this one directly).
  workflow_call:
    inputs:
      tag:
        description: "Release tag to create (at the built commit) and attach the app to"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -e ".[desktop,anthropic,openai]"
      - name: Loader tests on macOS
        run: pip install pytest && python -m pytest -q tests/test_loader.py
      - name: Build and smoke-test the app
        run: bash packaging/build.sh
      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "AI Safety Explorer.app" AI-Safety-Explorer-macOS.zip
          shasum -a 256 AI-Safety-Explorer-macOS.zip | tee AI-Safety-Explorer-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Safety-Explorer-macOS
          path: |
            dist/AI-Safety-Explorer-macOS.zip
            dist/AI-Safety-Explorer-macOS.zip.sha256
      - name: Attach to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Written release notes live in docs/releases/<tag>.md; without one, GitHub's
          # generated notes are used. Creating the release creates the tag at the commit
          # that was just built and smoke-tested, so the download and the tag always match.
          NOTES="docs/releases/${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Safety Explorer $TAG" \
                --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Safety Explorer $TAG" \
                --generate-notes --latest
            fi
          fi
          gh release upload "$TAG" dist/AI-Safety-Explorer-macOS.zip \
            dist/AI-Safety-Explorer-macOS.zip.sha256 --clobber
