name: macOS app

# Builds "AI Safety Explorer.app" — the self-updating loader — as a disk image (.dmg) and a zip,
# for Intel and Apple Silicon, and checks them the way a downloader gets them. When
# release.yml calls it with a tag (the usual way to release: merge a PR carrying
# docs/releases/v<version>.md), or on a pushed version tag (v1.2.3), it also publishes both
# to that GitHub Release. The link https://github.com/<repo>/releases/latest/download/
# AI-Safety-Explorer-macOS.dmg then always serves the newest. It also publishes app.json,
# which installed apps read to replace themselves with a newer app
# (src/explorer_loader/appupdate.py). Before any of it is published, a copy of the built app
# is made to do exactly that against a stand-in release (packaging/selfupdate_e2e.sh).
#
# Signing: with the Developer ID and notarization secrets set (docs/SIGNING.md), the app and
# the image are signed, notarized and stapled, and open like any app from the web. Without
# them, the app is ad-hoc signed and macOS asks the user to approve it once (docs/INSTALL.md).
#
# It also runs on any push that changes the loader or its packaging (GitHub does not apply
# path filters to tag pushes, so tags always build), and by hand from the Actions tab.
on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "src/explorer_loader/**"
      - "packaging/**"
      - "scripts/loader_app.py"
      - ".github/workflows/app.yml"
  workflow_dispatch:
  # Called by release.yml with the tag to publish (a tag CI creates itself does not trigger
  # other workflows, so the release workflow calls this one directly).
  workflow_call:
    inputs:
      tag:
        description: "Release tag to create (at the built commit) and attach the app to"
        type: string
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -e ".[desktop,anthropic,openai]"
      # Wheels published per architecture (the provider SDKs' jiter and pydantic_core) install
      # only this runner's arm64 slice; add the x86_64 one so the app runs on Intel Macs too.
      - name: Make native packages universal (Intel + Apple Silicon)
        run: python packaging/macho.py fuse
      - name: Loader and packaging tests on macOS
        run: pip install pytest && python -m pytest -q tests/test_loader.py tests/test_packaging.py
      - name: Build and smoke-test the app
        run: bash packaging/build.sh
      - name: Every binary runs on Intel and Apple Silicon
        run: |
          APP="dist/AI Safety Explorer.app"
          python packaging/macho.py report "$APP"
          python packaging/macho.py check "$APP"
          # And by Apple's own tool, independently of the reader above.
          python packaging/macho.py sign-order "$APP" | while IFS=$'\t' read -r kind path; do
            if [[ "$kind" != "bundle" ]]; then lipo "$path" -verify_arch arm64 x86_64; fi
          done
      - name: Sign
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: bash packaging/sign.sh "dist/AI Safety Explorer.app"
      - name: Notarize the app
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/notarize.sh "dist/AI Safety Explorer.app"
      - name: Run the signed app, and its Intel slice under Rosetta
        run: |
          bash packaging/smoke.sh "dist/AI Safety Explorer.app"
          if ! arch -x86_64 /usr/bin/true 2>/dev/null; then
            sudo softwareupdate --install-rosetta --agree-to-license || true
          fi
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            bash packaging/smoke.sh "dist/AI Safety Explorer.app" --arch x86_64
          else
            echo "::warning::Rosetta is unavailable on this runner: the x86_64 slices were checked with lipo, not run"
          fi
      - name: The app replaces itself with a newer release's app
        run: bash packaging/selfupdate_e2e.sh "dist/AI Safety Explorer.app"
      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "AI Safety Explorer.app" AI-Safety-Explorer-macOS.zip
          shasum -a 256 AI-Safety-Explorer-macOS.zip | tee AI-Safety-Explorer-macOS.zip.sha256
      - name: Disk image (built, then opened and run as a downloader would)
        run: bash packaging/make_dmg.sh "dist/AI Safety Explorer.app" dist/AI-Safety-Explorer-macOS.dmg
      - name: Notarize the disk image
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bash packaging/notarize.sh dist/AI-Safety-Explorer-macOS.dmg
      - name: Checksum the disk image
        run: |
          cd dist
          shasum -a 256 AI-Safety-Explorer-macOS.dmg | tee AI-Safety-Explorer-macOS.dmg.sha256
      - name: Release manifest (what installed apps read to update themselves)
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: python packaging/manifest.py dist
      - name: What Gatekeeper will say
        run: |
          if spctl --assess --type execute -vv "dist/AI Safety Explorer.app"; then
            echo "Notarized: Gatekeeper accepts the app on first launch."
          else
            echo "::notice::Not notarized: on first launch, macOS asks the user to approve the app once (docs/INSTALL.md; to remove the step, docs/SIGNING.md)."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Safety-Explorer-macOS
          path: |
            dist/app.json
            dist/AI-Safety-Explorer-macOS.dmg
            dist/AI-Safety-Explorer-macOS.dmg.sha256
            dist/AI-Safety-Explorer-macOS.zip
            dist/AI-Safety-Explorer-macOS.zip.sha256
      - name: Attach to the release
        if: inputs.tag != '' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # Written release notes live in docs/releases/<tag>.md; without one, GitHub's
          # generated notes are used. Creating the release creates the tag at the commit
          # that was just built and smoke-tested, so the download and the tag always match.
          NOTES="docs/releases/${TAG}.md"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Safety Explorer $TAG" \
                --notes-file "$NOTES" --latest
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "AI Safety Explorer $TAG" \
                --generate-notes --latest
            fi
          fi
          # app.json goes up last: an installed app acts on it, so the files it names are
          # already there when it appears.
          gh release upload "$TAG" dist/AI-Safety-Explorer-macOS.dmg \
            dist/AI-Safety-Explorer-macOS.dmg.sha256 dist/AI-Safety-Explorer-macOS.zip \
            dist/AI-Safety-Explorer-macOS.zip.sha256 --clobber
          gh release upload "$TAG" dist/app.json --clobber
