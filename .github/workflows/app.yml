name: macOS app

# Builds "AI Safety Explorer.app" — the self-updating loader — and smoke-tests it.
# On a version tag (v1.2.3) it also publishes the zipped app to that GitHub Release, which
# is the file testers download. Run it by hand from the Actions tab at any time.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14          # Apple Silicon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install -e ".[desktop,anthropic,openai]"
      - name: Loader tests on macOS
        run: pip install pytest && python -m pytest -q tests/test_loader.py
      - name: Build and smoke-test the app
        run: bash packaging/build.sh
      - name: Zip
        run: |
          cd dist
          ditto -c -k --keepParent "AI Safety Explorer.app" AI-Safety-Explorer-macOS.zip
          shasum -a 256 AI-Safety-Explorer-macOS.zip | tee AI-Safety-Explorer-macOS.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: AI-Safety-Explorer-macOS
          path: |
            dist/AI-Safety-Explorer-macOS.zip
            dist/AI-Safety-Explorer-macOS.zip.sha256
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/AI-Safety-Explorer-macOS.zip \
            dist/AI-Safety-Explorer-macOS.zip.sha256 --clobber
