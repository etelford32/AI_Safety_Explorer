<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" data-mark-version="2">
  <!-- AI Safety Explorer — app icon. Designed for Elliot Telford's AI Safety Explorer.

       The mark is the instrument's central idea drawn as orbital mechanics: two twin orbits
       sharing one focus. The inner orbit is the benign framing; the outer is its twin under
       riskier framing — the same body, the same physics, a wider path — shading from the
       cool accent into amber as it swings out. A tracked body sits on each, at the same phase:
       the matched pair the Explorer compares. Both orbits are true ellipses with a common
       focus (the star), as Kepler would have them.

       Strokes are heavy on purpose so the mark still reads at 16 px. The small-size variant
       (favicon.svg) is the same drawing with even heavier strokes and no star field. -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#18253f"/>
      <stop offset="1" stop-color="#0a0f1c"/>
    </linearGradient>
    <linearGradient id="twin" gradientUnits="userSpaceOnUse" x1="-60" y1="0" x2="520" y2="0">
      <stop offset="0" stop-color="#5aa9ff"/>
      <stop offset="0.55" stop-color="#9fb7e6"/>
      <stop offset="1" stop-color="#f2a65a"/>
    </linearGradient>
    <radialGradient id="star" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff6e6"/>
      <stop offset="0.35" stop-color="#ffd9a3" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ffd9a3" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowWarm" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd2a0" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#f2a65a" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#f2a65a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCool" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#5aa9ff" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5aa9ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- plate, inset to sit as a macOS icon -->
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#plate)"/>
  <rect x="101" y="101" width="822" height="822" rx="185" fill="none" stroke="#2c3d5e" stroke-width="2"/>

  <!-- a sparse star field; it vanishes gracefully at small sizes -->
  <g fill="#c9d6ee">
    <circle cx="238" cy="236" r="5" opacity="0.55"/>
    <circle cx="786" cy="214" r="4" opacity="0.45"/>
    <circle cx="842" cy="684" r="5" opacity="0.4"/>
    <circle cx="206" cy="806" r="4" opacity="0.35"/>
    <circle cx="560" cy="182" r="3" opacity="0.4"/>
    <circle cx="700" cy="842" r="3" opacity="0.35"/>
  </g>

  <!-- both orbits share one focus, at the star; the frame is rotated so the major axes tilt -->
  <g transform="translate(321 597) rotate(-24)">
    <!-- the benign twin -->
    <ellipse cx="132" cy="0" rx="200" ry="150" fill="none" stroke="#5aa9ff" stroke-width="30" opacity="0.6"/>
    <!-- the riskier twin: the same body on a wider path, warming as it swings out -->
    <ellipse cx="209" cy="0" rx="300" ry="215" fill="none" stroke="url(#twin)" stroke-width="30"/>
    <!-- the star at the common focus -->
    <circle cx="0" cy="0" r="74" fill="url(#star)"/>
    <circle cx="0" cy="0" r="20" fill="#fff6e6"/>
    <!-- the tracked pair, same phase on each orbit -->
    <circle cx="285" cy="-96" r="46" fill="url(#glowCool)"/>
    <circle cx="285" cy="-96" r="20" fill="#dcebff"/>
    <circle cx="439" cy="-138" r="84" fill="url(#glowWarm)"/>
    <circle cx="439" cy="-138" r="34" fill="#fff1de"/>
    <circle cx="439" cy="-138" r="34" fill="none" stroke="#f2a65a" stroke-width="8"/>
  </g>
</svg>
